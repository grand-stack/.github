#
# Shared CI for the GRANDstack repositories. Call it like this:
#   jobs:
#     ci:
#       uses: grand-stack/.github/.github/workflows/ci-node.yml@v1
#       with: { scripts: "typecheck test build docs:check" }
# It installs dependencies, runs the named npm scripts and any extra commands, and checks the copyright headers.
# (The release workflow, not this one, checks that a tag and the package.json versions agree.)
name: ci-node
on:
  workflow_call:
    inputs:
      working-directory:
        description: Folder with the package.json (for repositories with several packages)
        type: string
        default: "."
      install:
        description: Run npm ci first (false for a repository without a package.json)
        type: boolean
        default: true
      scripts:
        description: npm scripts to run, separated by spaces, in order
        type: string
        default: "typecheck test build docs:check"
      commands:
        description: Extra shell commands to run after the scripts (one per line)
        type: string
        default: ""
      node-version:
        type: string
        default: "24"
      check-headers:
        description: Check the copyright headers of the whole repository
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Shared scripts
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/.github
          ref: v1
          path: .shared-ci
      - name: Keep the shared scripts out of the workspace
        run: mv .shared-ci "$RUNNER_TEMP/shared-ci"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.install && 'npm' || '' }}
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - name: Install
        if: ${{ inputs.install }}
        working-directory: ${{ inputs.working-directory }}
        run: npm ci
      - name: npm scripts
        if: ${{ inputs.scripts != '' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          set -e
          for script in $SCRIPTS; do
            echo "::group::npm run $script"
            npm run "$script"
            echo "::endgroup::"
          done
      - name: Extra commands
        if: ${{ inputs.commands != '' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          COMMANDS: ${{ inputs.commands }}
        run: bash -e -c "$COMMANDS"
      - name: Copyright headers
        if: ${{ inputs.check-headers }}
        run: node "$RUNNER_TEMP/shared-ci/scripts/headers.mjs" --root . --check
