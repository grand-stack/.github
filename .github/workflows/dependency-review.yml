#
# Fails a pull request that adds a dependency with a known high-severity vulnerability. Needs the dependency graph enabled in the repository settings.
# (Licences are not checked yet.)
name: dependency-review
on:
  workflow_call:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
