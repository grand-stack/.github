# CodeQL code scanning for JavaScript and TypeScript. Call it from a repository's codeql workflow (push, pull_request, weekly schedule).
name: codeql
on:
  workflow_call:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
